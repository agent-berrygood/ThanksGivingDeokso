<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행자 컨트롤 · 감사 열매 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<main class="control" id="app">
  <header>
    <div>
      <h1>감사 열매 농장 · 진행자</h1>
      <div class="muted">세션 <b id="gameName"></b> · 반 참여 <b id="joinCount">0/12</b></div>
    </div>
    <div class="row">
      <button class="btn" id="openDisplay" type="button">출력 창 열기</button>
      <button class="btn secondary" id="qrToggle" type="button">출력 화면에 QR 띄우기</button>
      <button class="btn ghost" id="resetBtn" type="button">처음부터 다시</button>
    </div>
  </header>

  <div class="card">
    <div class="status-line"><span id="roundLabel"></span> <span id="phaseLabel"></span> <span class="timer" id="timer" style="font-size:22px;margin-left:8px"></span></div>
  </div>

  <div class="grid-2">
    <section class="card next-box">
      <h2 style="font-size:22px">지금 할 일</h2>
      <div class="preview" id="preview"></div>
      <button class="btn big" id="nextBtn" type="button"></button>
      <div class="row">
        <button class="btn secondary" id="undoBtn" type="button">직전 단계로 되돌리기</button>
        <button class="btn secondary" id="plusBtn" type="button">시간 +10초</button>
      </div>
      <p class="error" id="ctlErr"></p>
    </section>

    <section class="card">
      <h2 style="font-size:22px;margin-bottom:8px">반별 현황 <span class="pill" id="subCount"></span></h2>
      <table class="ctl">
        <thead><tr><th>반</th><th>선생님</th><th class="num">열매</th><th class="num">나눈 합</th><th>이번 제출</th><th>조정</th></tr></thead>
        <tbody id="classRows"></tbody>
      </table>
    </section>
  </div>

  <details class="card">
    <summary>문제와 인카운터 미리 보기</summary>
    <div class="grid-2" style="margin-top:12px">
      <div id="qList"></div>
      <div id="encList"></div>
    </div>
  </details>

  <details class="card" id="qrPanel">
    <summary>참여 QR</summary>
    <p class="noprint muted">출력 화면 시작 전 화면에 같은 QR이 크게 떠요. 반 선생님이 찍고 반을 고르면 돼요. 휴대폰을 바꾼 선생님이 있으면 반별 현황에서 '해제'를 눌러 주세요.</p>
    <div class="qr-card" style="max-width:320px"><div id="joinQr"></div><a id="joinLink" target="_blank" rel="noopener"></a></div>
  </details>
</main>
<script type="module" src="/js/control.js"></script>
</body>
</html>
