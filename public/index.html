<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감사 열매 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="home">
  <h1>감사 열매 농장</h1>
  <p class="lead">진행자용 첫 화면이에요. 세션을 열면 출력 화면에 참여 QR이 뜨고, 반 선생님들은 QR을 찍어 반을 고르면 돼요.</p>

  <section class="card">
    <button class="btn big" style="width:100%" id="newBtn" type="button" disabled>준비 중…</button>
    <p class="error" id="err"></p>
  </section>

  <section class="card hidden" id="resumeCard">
    <p style="margin:0 0 12px">이 기기에서 열었던 세션이 있어요.</p>
    <button class="btn big secondary" style="width:100%" id="resumeBtn" type="button">이어서 진행하기</button>
  </section>
</main>
<script type="module">
import { ready } from '/js/fb.js';
import { createSession, isAdmin, lastSession } from '/js/store.js';
import { $ } from '/js/ui.js';

const go = (g) => { location.href = `/control?s=${encodeURIComponent(g)}`; };
const user = await ready();

const prev = lastSession();
if (prev && await isAdmin(prev, user.uid)) {
  $('#resumeCard').classList.remove('hidden');
  $('#resumeBtn').addEventListener('click', () => go(prev));
}

$('#newBtn').disabled = false;
$('#newBtn').textContent = '새 세션 열기';
$('#newBtn').addEventListener('click', async () => {
  if (prev && !$('#resumeCard').classList.contains('hidden')
      && !confirm('새 세션을 열면 이전 세션 대신 새 QR로 시작해요. 열까요?')) return;
  $('#newBtn').disabled = true;
  $('#err').textContent = '';
  try {
    go(await createSession(user.uid));
  } catch (e) {
    console.error(e);
    $('#err').textContent = `세션을 열지 못했어요: ${e.message}`;
    $('#newBtn').disabled = false;
  }
});
</script>
</body>
</html>
