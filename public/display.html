<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출력 화면 · 감사 열매 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<div class="display-root">
  <header class="d-head">
    <div class="title">감사 열매 농장</div>
    <div class="phase" id="phase"></div>
    <div class="round" id="round"></div>
  </header>
  <section class="stage" id="stage"><h2>불러오는 중…</h2></section>
  <section class="board" id="board" aria-label="12개 반 열매 현황"></section>
</div>
<div class="qr-overlay hidden" id="qrOverlay">
  <div class="qr-box">
    <h2>반 선생님, QR을 찍고 반을 골라 주세요</h2>
    <div class="qr-img" id="qrOverlayImg"></div>
  </div>
</div>
<script type="module" src="/js/display.js"></script>
</body>
</html>
